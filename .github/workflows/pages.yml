name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test

  notebooks:
    # Independent of deploy: a notebook failure is reported but does not block the site.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: notebooks/requirements.txt
      - run: pip install -r notebooks/requirements.txt
      - name: Python tests (cross-checked against the JS engine)
        run: python -m pytest
        working-directory: notebooks
      - name: Execute all notebooks
        run: |
          python -m ipykernel install --user --name python3
          jupyter nbconvert --to notebook --execute --output-dir "$RUNNER_TEMP/nb" notebooks/*.ipynb

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
